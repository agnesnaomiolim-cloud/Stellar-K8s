[package]
name = "p2p-firewall"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "P2P Gossip Network Threat Detection Firewall for Stellar validator nodes"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-k8s"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Prometheus metrics
prometheus-client = "0.22"
once_cell = "1"

# Network / raw socket inspection (userspace interception)
bytes = "1.11.1"

# HTTP server for metrics endpoint and ban-manager API
axum = { version = "0.8.8", features = [] }

# Time
chrono = { version = "0.4", features = ["serde"] }
# Pinned to fix RUSTSEC-2026-0009
time = "0.3.47"

# IP address utilities
ipnetwork = "0.20"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
