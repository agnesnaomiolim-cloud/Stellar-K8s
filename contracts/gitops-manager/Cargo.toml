[package]
name = "gitops-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Soroban SDK (assume provided by workspace)
soroban-sdk = { path = "../../sdk" }

[lib]
path = "src/lib.rs"
