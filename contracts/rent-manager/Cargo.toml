[package]
name = "rent-manager"
version = "0.1.0"
edition = "2021"
description = "Soroban contract that manages Protocol 20 state archival, TWL extension and rent restoration for critical protocol state"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
doctest = false

[lib]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }
soroban-env = "21.0.0"
soroban-token = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
code-unit-lto = true
panic = "abort"

