[package]
name = "cl-amm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Concentrated liquidity AMM (tick-based, Q64.64 fixed point) for Stellar Soroban"
publish = false

# Standalone workspace root so this crate is not conflated with the parent
# operator workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.11"

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }
proptest = "1.5"
# Independent arbitrary-precision reference for the fixed-point math tests.
num-bigint = "0.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
