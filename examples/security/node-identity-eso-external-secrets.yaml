---
# ═══════════════════════════════════════════════════════════════════════════════
# 5.  HashiCorp Vault: SecretStore (namespace-scoped, Kubernetes auth)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: stellar-vault-secrets
  namespace: stellar
  labels:
    app.kubernetes.io/component: secret-store
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/issue: "#290"
    stellar.org/purpose: "node-identity-rotation"
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200      # ← change to your Vault address
      path: secret                               # KV-v2 mount path
      version: v2
      caBundle: ""                               # Base64 CA cert; leave empty to use system roots
      auth:
        kubernetes:
          mountPath: kubernetes
          role: stellar-node-identity-reader     # Vault role with policy below
          serviceAccountRef:
            name: stellar-external-secrets-sa
---
# ═══════════════════════════════════════════════════════════════════════════════
# 6.  Vault ExternalSecret — validator-0 node identity
# ═══════════════════════════════════════════════════════════════════════════════
#
# Required Vault policy (HCL):
#   path "secret/data/stellar/validators/*" {
#     capabilities = ["read"]
#   }
#   path "secret/metadata/stellar/validators/*" {
#     capabilities = ["read", "list"]
#   }
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-0-node-identity-vault
  namespace: stellar
  labels:
    app.kubernetes.io/component: node-identity
    stellar.org/node: validator-0
    stellar.org/secret-type: node-identity
    stellar.org/backend: vault
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/issue: "#290"
    stellar.org/rotation-period: "30d"
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: SecretStore
    name: stellar-vault-secrets

  target:
    name: validator-0-seed
    creationPolicy: Owner
    template:
      metadata:
        labels:
          stellar.org/node: validator-0
          stellar.org/secret-type: node-identity
      type: Opaque

  data:
    - secretKey: seed
      remoteRef:
        key: stellar/validators/validator-0     # Vault KV path (without "secret/data/" prefix)
        property: seed
    - secretKey: public_key
      remoteRef:
        key: stellar/validators/validator-0
        property: public_key
---
# ═══════════════════════════════════════════════════════════════════════════════
# 7.  StellarNode CR — validator with ESO-backed node identity
#
# The operator watches for changes to the "validator-0-seed" K8s Secret
# (created/refreshed by ESO) and triggers rotation when the fingerprint changes.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata:
  name: validator-0
  namespace: stellar
  labels:
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/issue: "#290"
spec:
  nodeType: Validator
  network: testnet
  version: "v21.0.0"

  validatorConfig:
    # Reference the K8s Secret created by ESO above.
    seedSecretRef: "validator-0-seed"
    enableHistoryArchive: true

    # ESO integration — the operator reconciles identity changes from ESO.
    nodeIdentityRotation:
      enabled: true
      # External secret path in the backend store.
      secretPath: "stellar/validators/validator-0"
      # Rotation period (must match the ESO refreshInterval cadence).
      rotationPeriodDays: 30
      # Seconds to wait between rotating successive nodes (quorum safety).
      interNodeDelaySeconds: 120
      # Seconds to wait for a node to rejoin after identity injection.
      rejoinTimeoutSeconds: 300
      # Minimum authenticated peers before declaring node healthy.
      minAuthenticatedPeers: 1
      # Auto-rollback to previous identity if rotation fails.
      rollbackOnFailure: true
      # Update Horizon DB to reflect the new public key.
      updateHorizonDb: false

  storage:
    storageClass: "standard"
    size: "100Gi"
    retentionPolicy: Retain

  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
---
# ═══════════════════════════════════════════════════════════════════════════════
# 8.  RBAC — operator permissions to read ESO-produced Secrets
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stellar-node-identity-reader
  namespace: stellar
  annotations:
    stellar.org/issue: "#290"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # The operator only needs to read the specific node-identity secrets.
    resourceNames:
      - validator-0-seed
      - validator-1-seed
      - validator-2-seed
      - validator-3-seed
      - validator-4-seed
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stellar-operator-node-identity-reader
  namespace: stellar
  annotations:
    stellar.org/issue: "#290"
subjects:
  - kind: ServiceAccount
    name: stellar-operator
    namespace: stellar-system
roleRef:
  kind: Role
  name: stellar-node-identity-reader
  apiGroup: rbac.authorization.k8s.io
