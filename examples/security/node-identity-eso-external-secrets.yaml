# ─────────────────────────────────────────────────────────────────────────────
# ESO ExternalSecret manifests for Stellar validator node identity rotation
#
# Issue #290: P2P Node Identity & Secrets Rotation via GitOps
#
# These manifests configure the External Secrets Operator (ESO) to pull
# ed25519 Stellar node identities from AWS Secrets Manager or HashiCorp Vault
# and materialise them as Kubernetes Secrets consumed by the Stellar-K8s
# operator.
#
# Prerequisites:
#   - External Secrets Operator installed (https://external-secrets.io)
#   - A SecretStore or ClusterSecretStore configured for your backend
#   - IRSA or Vault Kubernetes auth configured for the ESO service account
#
# Secret format in the external store (JSON):
#   {
#     "seed": "SCZANGBA5WGHMF7EBDKZP6LKQMJIHQPGTZGVQSKTXJCQC4D3BBZDEXM",
#     "public_key": "GABC..."
#   }
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
# 1.  AWS Secrets Manager: SecretStore (namespace-scoped, IRSA)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: stellar-aws-secrets-manager
  namespace: stellar
  labels:
    app.kubernetes.io/component: secret-store
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/issue: "#290"
    stellar.org/purpose: "node-identity-rotation"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1              # ← change to your region
      auth:
        jwt:
          serviceAccountRef:
            name: stellar-external-secrets-sa
            audiences:
              - sts.amazonaws.com
---
# ═══════════════════════════════════════════════════════════════════════════════
# 2.  AWS IAM ServiceAccount (EKS IRSA)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-external-secrets-sa
  namespace: stellar
  labels:
    app.kubernetes.io/component: eso-service-account
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    # Replace with your IAM role ARN.
    # The role must have secretsmanager:GetSecretValue on the paths below.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/stellar-node-identity-reader
---
# ═══════════════════════════════════════════════════════════════════════════════
# 3.  AWS ExternalSecret — validator-0 node identity (30-day rotation)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-0-node-identity
  namespace: stellar
  labels:
    app.kubernetes.io/component: node-identity
    stellar.org/node: validator-0
    stellar.org/secret-type: node-identity       # label watched by the operator
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/issue: "#290"
    stellar.org/rotation-period: "30d"
spec:
  # Refresh interval — ESO will re-read the secret from AWS every 1h.
  # The operator compares fingerprints and only triggers rotation when the
  # seed actually changes.
  refreshInterval: 1h

  secretStoreRef:
    kind: SecretStore
    name: stellar-aws-secrets-manager

  target:
    name: validator-0-seed          # K8s Secret created/updated by ESO
    creationPolicy: Owner
    template:
      metadata:
        labels:
          stellar.org/node: validator-0
          stellar.org/secret-type: node-identity
      type: Opaque
      data:
        # The operator reads the "seed" key from this Secret.
        seed: "{{ .seed }}"
        public_key: "{{ .public_key }}"

  data:
    - secretKey: seed
      remoteRef:
        key: stellar/validators/validator-0      # AWS secret name/ARN
        property: seed                           # JSON field
    - secretKey: public_key
      remoteRef:
        key: stellar/validators/validator-0
        property: public_key
---
# ═══════════════════════════════════════════════════════════════════════════════
# 4.  AWS ExternalSecrets — validators 1..4 (5-node testnet cluster)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-1-node-identity
  namespace: stellar
  labels:
    stellar.org/node: validator-1
    stellar.org/secret-type: node-identity
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/rotation-period: "30d"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stellar-aws-secrets-manager
  target:
    name: validator-1-seed
    creationPolicy: Owner
    template:
      metadata:
        labels:
          stellar.org/node: validator-1
          stellar.org/secret-type: node-identity
      type: Opaque
  data:
    - secretKey: seed
      remoteRef:
        key: stellar/validators/validator-1
        property: seed
    - secretKey: public_key
      remoteRef:
        key: stellar/validators/validator-1
        property: public_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-2-node-identity
  namespace: stellar
  labels:
    stellar.org/node: validator-2
    stellar.org/secret-type: node-identity
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/rotation-period: "30d"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stellar-aws-secrets-manager
  target:
    name: validator-2-seed
    creationPolicy: Owner
    template:
      metadata:
        labels:
          stellar.org/node: validator-2
          stellar.org/secret-type: node-identity
      type: Opaque
  data:
    - secretKey: seed
      remoteRef:
        key: stellar/validators/validator-2
        property: seed
    - secretKey: public_key
      remoteRef:
        key: stellar/validators/validator-2
        property: public_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-3-node-identity
  namespace: stellar
  labels:
    stellar.org/node: validator-3
    stellar.org/secret-type: node-identity
    stellar.org/managed-by: stellar-k8s-operator
  annotations:
    stellar.org/rotation-period: "30d"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stellar-aws-secrets-manager
  target:
    name: validator-3-seed
    creationPolicy: Owner
    template:
      metadata:
        labels:
          stellar.org/node: validator-3
          stellar.org/secret-type: node-identity
      type: Opaque
  data:
    - secretKey: seed
      remoteRef:
