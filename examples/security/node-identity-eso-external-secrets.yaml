        key: stellar/validators/validator-3
        property: public_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-4-node-identity
  namespace: stellar
  labels:
    stellar.org/node: validator-4
    stellar.org/secret-type: node-identity
