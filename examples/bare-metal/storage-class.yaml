# examples/bare-metal/storage-class.yaml
#
# Bare-metal StorageClasses for StellarNode local NVMe.
# See docs/infrastructure/bare-metal.md, section 5.
#
# These classes have NO cloud provider dependency:
#   stellar-nvme-local      -> Rancher Local Path Provisioner (hostPath, node-local)
#   openebs-hostpath-stellar -> OpenEBS LocalPV Hostpath
#   stellar-nvme-mayastor   -> OpenEBS Mayastor (replicated; optional, HA)
#
# Apply the provisioner first, then these classes:
#   kubectl apply -f examples/bare-metal/storage-class.yaml
#   kubectl get storageclass
#
# Both local classes use volumeBindingMode: WaitForFirstConsumer. This is required:
# the PV must be created on the node the pod was scheduled to, otherwise a
# pod pinned by spec.storage.nodeAffinity can never bind its volume.

---
# Local Path Provisioner — the default choice for validator / archive data.
# Install the v0.0.30 manifest, then point its local-path-config ConfigMap at the
# mounted NVMe path (/var/mnt/stellar/local-path). Both commands are in
# docs/infrastructure/bare-metal.md, section 5.2.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: stellar-nvme-local
  annotations:
    stellar.org/description: "Node-local NVMe via Local Path Provisioner (no replication)"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false

---
# OpenEBS LocalPV Hostpath — same single-node semantics as local-path, but with the
# OpenEBS operational tooling. Install OpenEBS first:
#   helm install openebs openebs/openebs -n openebs --create-namespace \
#     --set localpv-provisioner.hostpathClass.isDefaultClass=false \
#     --set localpv-provisioner.hostpathClass.basePath=/var/mnt/stellar/openebs
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-stellar
  annotations:
    stellar.org/description: "Node-local NVMe via OpenEBS LocalPV Hostpath (no replication)"
provisioner: openebs.io/local
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false

---
# OpenEBS Mayastor — replicated (repl=3) NVMe-oF storage for HA validators that need
# the data volume to survive a single node loss. Requires >= 3 NVMe-backed nodes and
# hugepages configured on each. Enable the engine at install time:
#   helm install openebs openebs/openebs -n openebs --create-namespace \
#     --set engines.replicated.mayastor.enabled=true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: stellar-nvme-mayastor
  annotations:
    stellar.org/description: "Replicated NVMe over Fabrics via OpenEBS Mayastor (repl=3)"
provisioner: io.openebs.csi-mayastor
parameters:
  protocol: nvmf
  repl: "3"
  fsType: xfs
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
