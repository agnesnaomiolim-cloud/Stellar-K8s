# examples/bare-metal/lab/local-volume-probe.yaml
#
# Deterministic local-disk probe used by verify.sh.
#
# Unlike the example StellarNode (which needs a real validator seed to reach
# Ready), this workload only exercises the storage path:
#   - the PVC binds through a node-local StorageClass,
#   - the pod is pinned to a node carrying the NVMe label, and
#   - data written to the volume survives pod re-creation.
#
# It is applied into the dedicated `stellar-lab-probe` namespace so it never
# interferes with the StellarNode under test.

apiVersion: v1
kind: Namespace
metadata:
  name: stellar-lab-probe

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-volume-probe
  namespace: stellar-lab-probe
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: stellar-nvme-local
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: local-volume-probe
  namespace: stellar-lab-probe
  labels:
    app: local-volume-probe
spec:
  restartPolicy: Never
  nodeSelector:
    stellar.io/nvme: "true"
  containers:
    - name: probe
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: local-volume-probe
