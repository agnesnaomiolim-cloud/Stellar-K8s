[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kubernetes client
kube = { version = "0.94", features = ["runtime", "client"] }
k8s-openapi = { version = "0.22", default-features = false, features = ["v1_30"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for scraping pod Prometheus endpoints
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"

# Error handling
thiserror = "1"

# Optional: jemalloc allocator statistics via MIB API.
# Enabled with `--features jemalloc`.
tikv-jemalloc-ctl = { version = "0.6", optional = true }

[features]
# Enable live jemalloc stats collection from the operator's own allocator.
# When disabled (default), JemallocSnapshot::collect() returns a zeroed snapshot.
jemalloc = ["tikv-jemalloc-ctl"]
