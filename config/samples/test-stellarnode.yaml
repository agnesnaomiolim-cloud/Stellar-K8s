# test-stellarnode.yaml
# Minimal Testnet validator for CI, integration tests, and local dev.
# Canonical defaults are mirrored from examples/validator-testnet.yaml.
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata:
  name: test-validator
  namespace: default
  annotations:
    # Wasm admission policy configuration for this StellarNode.
    # The WASM plugin enforces the allowed Docker registry list.
    stellar.org/wasm-policy: "allowed-registries"
    stellar.org/wasm-fail-mode: "fail-closed"
spec:
  nodeType: Validator
  network: testnet
  version: "v21.0.0"
  replicas: 1
  # Canonical default resource footprint for a Testnet validator.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  storage:
    storageClass: "standard"
    size: "100Gi"
    retentionPolicy: Delete
  validatorConfig:
    seedSecretRef: "validator-seed"
    enableHistoryArchive: true
  # Approved registry for the WASM admission policy to validate.
  image:
    repository: "docker.io/stellar/stellar-core"
    tag: "v21.0.0"
    pullPolicy: IfNotPresent
