[package]
name = "stellar-telemetry"
version = "0.1.0"
edition = "2021"
description = "Sorban telemetry sidecar for host function pricing calibration"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
this-error = "1.0.60"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
metrics = "0.22.0"
metrics-exporter-prometheus = "0.13.0"
tokio = { version = "1.36", features = ["full"] }
core-affinity = "0.5.1"
hwloc = "0.4.0"
num_cpus = "1.16.0"
chrono: = "0.4.31"

[dev-dependencies]
tempfile = "3.10"
