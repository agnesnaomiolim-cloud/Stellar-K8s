[package]
name    = "stellar-telemetry"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "Telemetry streaming for Stellar-K8s: Soroban gas profiling and Envoy traffic heatmap"
license = "Apache-2.0"

# ---------------------------------------------------------------------------
# Core async runtime
# ---------------------------------------------------------------------------
[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ---------------------------------------------------------------------------
# HTTP client – used by EnvoyStatsStreamer to poll Envoy admin endpoints
# ---------------------------------------------------------------------------
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-manual-roots",
] }

# ---------------------------------------------------------------------------
# Serialisation
# ---------------------------------------------------------------------------
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ---------------------------------------------------------------------------
# Prometheus metrics (existing exporter module)
# ---------------------------------------------------------------------------
prometheus-client = "0.22"
prometheus        = { version = "0.13", features = ["process"] }
lazy_static       = "1"

# ---------------------------------------------------------------------------
# HTTP server (existing exporter module)
# ---------------------------------------------------------------------------
axum = { version = "0.7", features = ["macros"] }

# ---------------------------------------------------------------------------
# Error handling
# ---------------------------------------------------------------------------
thiserror = "1"
anyhow    = "1"

# ---------------------------------------------------------------------------
# Logging / tracing
# ---------------------------------------------------------------------------
tracing = "0.1"

# ---------------------------------------------------------------------------
# WebSocket server (used by the WS fan-out layer that feeds heatmap.worker.js)
# ---------------------------------------------------------------------------
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
